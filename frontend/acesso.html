<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="acesso.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
    <script src="auth.js" defer></script>
    <script src="scacesso.js" defer></script>
    <title>Acesso - FreelanTchê</title>
</head>
<body>
    <main class="caixa-acesso">
        <h1>FreelanTchê</h1>
        <p class="subtitulo">Como você quer usar a plataforma?</p>

        <div class="opcoes">
            <button type="button" class="opcao" data-modo="contratar">
                <strong>Quero contratar serviços</strong>
                <small>Encontre profissionais para o que você precisa.</small>
            </button>
            <button type="button" class="opcao" data-modo="prestar">
                <strong>Quero prestar serviços</strong>
                <small>Ofereça seu trabalho e encontre clientes.</small>
            </button>
        </div>

        <p class="dica">Você usa uma única conta para as duas opções e pode trocar quando quiser.</p>
        <p class="links"><a href="index.html">Voltar ao site</a></p>
    </main>
