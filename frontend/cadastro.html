<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="acesso.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
    <script src="auth.js" defer></script>
    <script src="sccadastro.js" defer></script>
    <title>Criar conta - FreelanTchê</title>
</head>
<body>
    <main class="caixa-acesso">
        <h1>Criar conta</h1>
        <p class="modo-atual">Modalidade: <strong id="rotulo-modo"></strong> (<a href="acesso.html">trocar</a>)</p>

        <form id="form-cadastro" novalidate>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" autocomplete="name" maxlength="100" required>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="new-password" required>
                <small>Mínimo de 8 caracteres.</small>
            </div>
            <div class="campo">
                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" autocomplete="new-password" required>
            </div>

            <p id="mensagem" class="mensagem" role="alert" hidden></p>

            <button type="submit" id="botao-cadastrar" class="botao">Criar conta</button>
        </form>

        <div id="area-confirmacao" hidden>
            <p class="mensagem sucesso">
                Quase lá! Enviamos um e-mail de confirmação para <strong id="email-confirmacao"></strong>.
                Clique no link da mensagem (veja também o spam) para ativar a conta e depois entre.
            </p>
            <p class="links"><a id="link-login-confirmacao" href="login.html">Ir para o login</a></p>
        </div>

        <p class="links" id="rodape-cadastro">Já tem conta? <a id="link-login" href="login.html">Entrar</a></p>
        <p class="links"><a href="acesso.html">Voltar à escolha</a></p>
    </main>
</body>
</html>
