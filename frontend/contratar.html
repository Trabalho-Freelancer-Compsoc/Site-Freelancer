<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="acesso.css">
    <link rel="stylesheet" href="contratacao.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
    <script src="auth.js" defer></script>
    <script src="sccontratar.js" defer></script>
    <title>Contratar serviço - FreelanTchê</title>
</head>
<body data-requer-login>
    <main class="caixa-acesso caixa-larga">
        <h1>Contratar serviço</h1>

        <div id="resumo" class="resumo-servico" hidden></div>

        <p id="mensagem" class="mensagem" role="alert" hidden></p>

        <form id="form-contratar" novalidate hidden>
            <div class="campo">
                <label for="valor">Valor que você propõe (R$)</label>
                <input type="number" id="valor" min="0" step="0.01" autocomplete="off" required>
                <small>Já vem preenchido com o valor do anúncio. Se quiser, mude.</small>
            </div>
            <div class="campo">
                <label for="prazo">Prazo (em dias)</label>
                <input type="number" id="prazo" min="1" max="365" step="1" value="1" autocomplete="off" required>
            </div>
            <div class="campo">
                <label for="texto">Detalhes do que você precisa</label>
                <textarea id="texto" maxlength="1000" required></textarea>
                <small>Conte o que precisa ser feito, o dia e o local combinados, etc.</small>
            </div>

            <button type="submit" id="botao-enviar" class="botao">Enviar pedido</button>
        </form>

        <p class="links"><a href="index.html">Voltar ao site</a> · <a href="contratacoes.html">Minhas contratações</a></p>
    </main>
</body>
</html>
