<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="acesso.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
    <script src="auth.js" defer></script>
    <script src="scnovasenha.js" defer></script>
    <title>Nova senha - FreelanTchê</title>
</head>
<body>
    <main class="caixa-acesso">
        <h1>Nova senha</h1>

        <p id="verificando" class="subtitulo">Verificando o link...</p>

        <div id="area-form" hidden>
            <form id="form-nova-senha" novalidate>
                <div class="campo">
                    <label for="senha">Nova senha</label>
                    <input type="password" id="senha" autocomplete="new-password" required>
                    <small>Mínimo de 8 caracteres.</small>
                </div>
                <div class="campo">
                    <label for="confirmar">Confirmar nova senha</label>
                    <input type="password" id="confirmar" autocomplete="new-password" required>
                </div>

                <p id="mensagem" class="mensagem" role="alert" hidden></p>

                <button type="submit" id="botao-salvar" class="botao">Salvar nova senha</button>
            </form>
        </div>

        <div id="area-invalido" hidden>
            <p class="mensagem erro">Este link é inválido ou já expirou. Na tela de login, use "Esqueci minha senha" para receber outro.</p>
            <p class="links"><a href="acesso.html">Ir para o acesso</a></p>
        </div>
    </main>
</body>
</html>
